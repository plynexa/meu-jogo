name: Compilar ferramentas do criador
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/criador-tools.yml'
      - 'ferramentas/criador/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Compilar extrator de sprites
        run: g++ -O2 -std=c++17 -static ferramentas/criador/SpriteExtractor.cpp -o SpriteExtractor.exe
      - name: Compilar modo criador admin
        run: g++ -O2 -std=c++17 -static ferramentas/criador/ModoCriadorAdmin.cpp -lsqlite3 -o ModoCriadorAdmin.exe
      - name: Verificar dependencias externas
        run: |
          echo 'Dependencias do ModoCriadorAdmin:'
          objdump -p ModoCriadorAdmin.exe | grep 'DLL Name' || true
      - name: Montar pacote
        run: |
          mkdir -p dist
          cp SpriteExtractor.exe dist/
          cp ModoCriadorAdmin.exe dist/
          printf 'Executaveis compilados estaticamente. Nao exigem DLL do MSYS2 ao lado.\nModoCriadorAdmin.exe: feche o servidor antes de alterar o banco.\n' > dist/LEIA-ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MeuJogo-Ferramentas-Criador-Estaticas
          path: dist/
          if-no-files-found: error
