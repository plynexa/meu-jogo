name: Montar Crystal 15.24 pronto para teste

on:
  push:
    branches:
      - fix-crystal-1524-package
    paths:
      - '.github/workflows/montar-crystal-1524-pronto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  montar:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout controle
        uses: actions/checkout@v4
        with:
          path: controle

      - name: Baixar fonte completa Crystal Server 4.1.8 / protocolo 15.24
        uses: actions/checkout@v4
        with:
          repository: zimbadev/crystalserver
          ref: 4.1.8
          path: crystal-src
          lfs: true

      - name: Baixar cliente oficial correspondente 15.24.eb0021
        uses: actions/checkout@v4
        with:
          repository: zimbadev/gameclient
          ref: 15.24.eb0021
          path: client-src
          lfs: true

      - name: Baixar binario oficial Crystal Server 4.1.8
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/zimbadev/crystalserver/releases/download/4.1.8/crystalserver.rar' -OutFile 'crystalserver.rar'
          if ((Get-Item 'crystalserver.rar').Length -lt 1000000) { throw 'Download do binario do servidor parece invalido.' }

      - name: Montar servidor completo
        shell: pwsh
        run: |
          $server = 'pacote/01 - Servidor Crystal 15.24'
          New-Item -ItemType Directory -Force $server | Out-Null
          & 7z x 'crystalserver.rar' "-o$server" -y | Out-Host

          Copy-Item 'crystal-src/data' "$server/data" -Recurse -Force
          Copy-Item 'crystal-src/data-global' "$server/data-global" -Recurse -Force
          if (Test-Path 'crystal-src/data-crystal') {
            Copy-Item 'crystal-src/data-crystal' "$server/data-crystal" -Recurse -Force
          }
          Copy-Item 'crystal-src/schema.sql' "$server/schema.sql" -Force
          Copy-Item 'crystal-src/key.pem' "$server/key.pem" -Force
          Copy-Item 'crystal-src/config.lua.dist' "$server/config.lua" -Force
          Copy-Item 'crystal-src/LICENSE' "$server/LICENSE-CrystalServer.txt" -Force

          $cfg = "$server/config.lua"
          $s = Get-Content $cfg -Raw
          $s = [regex]::Replace($s, '(?m)^ip\s*=\s*.*$', 'ip = "127.0.0.1"')
          $s = [regex]::Replace($s, '(?m)^mapName\s*=\s*.*$', 'mapName = "world"')
          $s = [regex]::Replace($s, '(?m)^mysqlHost\s*=\s*.*$', 'mysqlHost = "127.0.0.1"')
          $s = [regex]::Replace($s, '(?m)^mysqlUser\s*=\s*.*$', 'mysqlUser = "root"')
          $s = [regex]::Replace($s, '(?m)^mysqlPass\s*=\s*.*$', 'mysqlPass = ""')
          $s = [regex]::Replace($s, '(?m)^mysqlDatabase\s*=\s*.*$', 'mysqlDatabase = "crystalserver"')
          $s = [regex]::Replace($s, '(?m)^mysqlPort\s*=\s*.*$', 'mysqlPort = 3306')
          $s = [regex]::Replace($s, '(?m)^mysqlDatabaseBackup\s*=\s*.*$', 'mysqlDatabaseBackup = false')
          Set-Content -Path $cfg -Value $s -Encoding UTF8

          @'
          @echo off
          setlocal
          title Meu Jogo - Crystal Server 15.24
          cd /d "%~dp0"

          echo ================================================
          echo   MEU JOGO - CRYSTAL SERVER 15.24 - LOCAL
          echo ================================================
          echo.

          if not exist "config.lua" (
            echo [ERRO] config.lua ausente.
            pause
            exit /b 1
          )
          if not exist "data-global\world\world.otbm" (
            echo [ERRO] data-global\world\world.otbm ausente.
            pause
            exit /b 1
          )
          if not exist "schema.sql" (
            echo [ERRO] schema.sql ausente.
            pause
            exit /b 1
          )

          set "MYSQL=C:\xampp\mysql\bin\mysql.exe"
          set "MYSQLADMIN=C:\xampp\mysql\bin\mysqladmin.exe"

          if not exist "%MYSQL%" (
            echo [ERRO] XAMPP nao encontrado em C:\xampp.
            echo Este launcher espera a instalacao padrao C:\xampp.
            pause
            exit /b 1
          )

          "%MYSQLADMIN%" -h 127.0.0.1 -u root ping >nul 2>&1
          if errorlevel 1 (
            echo [INFO] Iniciando MySQL do XAMPP...
            if exist "C:\xampp\mysql_start.bat" start "XAMPP MySQL" /min "C:\xampp\mysql_start.bat"
            timeout /t 7 /nobreak >nul
          )

          "%MYSQLADMIN%" -h 127.0.0.1 -u root ping >nul 2>&1
          if errorlevel 1 (
            echo [ERRO] MySQL do XAMPP nao respondeu com usuario root sem senha.
            echo Abra o XAMPP Control Panel, clique START em MySQL e execute novamente.
            echo Se voce configurou senha para root, ela precisara ser colocada no config.lua e neste launcher.
            pause
            exit /b 1
          )

          echo [OK] MySQL esta ativo.
          "%MYSQL%" -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS crystalserver CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          if errorlevel 1 (
            echo [ERRO] Nao consegui criar o banco crystalserver.
            pause
            exit /b 1
          )

          "%MYSQL%" -h 127.0.0.1 -u root -N -s -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='crystalserver' AND table_name='accounts';" > "%TEMP%\crystal_tables.txt"
          set /p HAS_ACCOUNTS=<"%TEMP%\crystal_tables.txt"
          if not "%HAS_ACCOUNTS%"=="1" (
            echo [INFO] Importando schema.sql na primeira execucao...
            "%MYSQL%" -h 127.0.0.1 -u root crystalserver < "schema.sql"
            if errorlevel 1 (
              echo [ERRO] Falha ao importar schema.sql.
              pause
              exit /b 1
            )
            echo [OK] Banco inicializado.
          ) else (
            echo [OK] Banco Crystal ja existe e possui a tabela accounts.
          )

          echo.
          echo [INFO] Iniciando Crystal Server no diretorio correto...
          echo Para encerrar normalmente, use Ctrl+C. Se travar, execute ENCERRAR SERVIDOR.bat.
          echo.
          "crystalserver-x64.exe"
          echo.
          echo O processo do servidor terminou.
          pause
          '@ | Set-Content "$server/INICIAR SERVIDOR 15.24.bat" -Encoding ASCII

          @'
          @echo off
          title Encerrar Crystal Server
          taskkill /F /IM crystalserver-x64.exe >nul 2>&1
          if errorlevel 1 (
            echo O Crystal Server nao estava em execucao.
          ) else (
            echo Crystal Server encerrado.
          )
          timeout /t 2 /nobreak >nul
          '@ | Set-Content "$server/ENCERRAR SERVIDOR.bat" -Encoding ASCII

          @'
          CRYSTAL SERVER 4.1.8 / PROTOCOLO 15.24 - TESTE LOCAL

          Este pacote corrige o erro "cannot open config.lua" do pacote binario isolado.
          Agora inclui config.lua, schema.sql, key.pem, data, data-global, mapa world.otbm e DLLs.

          CONFIGURACAO LOCAL:
          - IP: 127.0.0.1
          - Portas: 7171 / 7172
          - XAMPP/MySQL: 127.0.0.1:3306
          - Usuario MySQL: root
          - Senha MySQL: vazia (padrao do XAMPP)
          - Banco: crystalserver
          - Mapa: world.otbm

          COMO TESTAR:
          1. Extraia o ZIP inteiro para uma pasta simples, por exemplo C:\Tibia1524\Servidor.
          2. Dê dois cliques em INICIAR SERVIDOR 15.24.bat.
          3. O launcher verifica/inicia MySQL, cria o banco e importa schema.sql se necessario.
          4. Depois inicia o Crystal Server no diretorio correto.

          PARA FECHAR:
          - primeiro tente Ctrl+C no console;
          - se nao fechar, execute ENCERRAR SERVIDOR.bat.
          '@ | Set-Content "$server/LEIA PRIMEIRO.txt" -Encoding UTF8

      - name: Montar cliente oficial completo correspondente ao servidor
        shell: pwsh
        run: |
          $client = 'pacote/02 - Cliente Oficial 15.24'
          New-Item -ItemType Directory -Force $client | Out-Null
          Get-ChildItem 'client-src' -Force | Where-Object { $_.Name -ne '.git' } | ForEach-Object {
            Copy-Item $_.FullName "$client/" -Recurse -Force
          }

          # A propria release 15.24.eb0021 exige extrair este RAR para o cliente funcionar corretamente.
          $webEngine = "$client/bin/Qt6WebEngineCore.rar"
          if (-not (Test-Path $webEngine)) { throw 'Qt6WebEngineCore.rar ausente no cliente oficial.' }
          & 7z x $webEngine "-o$client/bin" -y | Out-Host

          # A nota oficial recomenda os arquivos de cache como somente leitura.
          if (Test-Path "$client/cache") {
            Get-ChildItem "$client/cache" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { $_.IsReadOnly = $true }
          }

          @'
          @echo off
          setlocal
          title Cliente Tibia 15.24 - Crystal
          cd /d "%~dp0"
          if not exist "bin\client.exe" (
            echo [ERRO] bin\client.exe nao encontrado.
            pause
            exit /b 1
          )
          if not exist "package.json" (
            echo [ERRO] Runtime do cliente incompleto: package.json ausente.
            pause
            exit /b 1
          )
          start "Tibia 15.24" /D "%~dp0" "bin\client.exe"
          '@ | Set-Content "$client/INICIAR CLIENTE 15.24.bat" -Encoding ASCII

          @'
          CLIENTE OFICIAL CORRESPONDENTE AO CRYSTAL SERVER 4.1.8
          Versao: 15.24.eb0021
          Fonte: zimbadev/gameclient

          Este pacote substitui o OTClient incompleto que continha somente EXE/EXP/LIB/PDB e gerava:
          "Unable to find work directory, the application cannot be initialized."

          O pacote novo inclui o runtime completo. O Qt6WebEngineCore.rar ja foi extraido durante a montagem e o cache foi preparado conforme a nota oficial da release.

          Para testar, dê dois cliques em INICIAR CLIENTE 15.24.bat.
          O cliente oficial desta tag ja vem configurado com RSA OpenTibia e IP local para teste.
          '@ | Set-Content "$client/LEIA PRIMEIRO.txt" -Encoding UTF8

      - name: Validar estrutura antes de publicar
        shell: pwsh
        run: |
          $server = 'pacote/01 - Servidor Crystal 15.24'
          $client = 'pacote/02 - Cliente Oficial 15.24'
          $required = @(
            "$server/crystalserver-x64.exe",
            "$server/config.lua",
            "$server/schema.sql",
            "$server/key.pem",
            "$server/data-global/world/world.otbm",
            "$server/data-global/world/world-monster.xml",
            "$server/data-global/world/world-npc.xml",
            "$client/bin/client.exe",
            "$client/package.json",
            "$client/assets.json",
            "$client/bin/Qt6Core.dll",
            "$client/bin/Qt6WebEngineProcess.exe"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Arquivo obrigatorio ausente: $f" }
            Write-Host "[OK] $f"
          }

          $mapSize = (Get-Item "$server/data-global/world/world.otbm").Length
          $clientSize = (Get-Item "$client/bin/client.exe").Length
          $serverSize = (Get-Item "$server/crystalserver-x64.exe").Length
          Write-Host "Mapa world.otbm: $mapSize bytes"
          Write-Host "client.exe: $clientSize bytes"
          Write-Host "crystalserver-x64.exe: $serverSize bytes"
          if ($mapSize -lt 40000000) { throw 'world.otbm parece incompleto.' }
          if ($clientSize -lt 30000000) { throw 'client.exe parece incompleto.' }
          if ($serverSize -lt 1000000) { throw 'crystalserver-x64.exe parece incompleto.' }

          $cfg = Get-Content "$server/config.lua" -Raw
          if ($cfg -notmatch 'mapName\s*=\s*"world"') { throw 'config.lua nao aponta para world.otbm.' }
          if ($cfg -notmatch 'mysqlDatabaseBackup\s*=\s*false') { throw 'mysqlDatabaseBackup nao foi configurado.' }

      - name: Testar abertura do servidor ate a etapa de banco
        shell: pwsh
        run: |
          $wd = (Resolve-Path 'pacote/01 - Servidor Crystal 15.24').Path
          $log = Join-Path $env:RUNNER_TEMP 'server-test.log'
          $err = Join-Path $env:RUNNER_TEMP 'server-test.err.log'
          $p = Start-Process -FilePath (Join-Path $wd 'crystalserver-x64.exe') -WorkingDirectory $wd -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 12
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $txt = ''
          if (Test-Path $log) { $txt += (Get-Content $log -Raw -ErrorAction SilentlyContinue) }
          if (Test-Path $err) { $txt += (Get-Content $err -Raw -ErrorAction SilentlyContinue) }
          Write-Host $txt
          if ($txt -match 'cannot open config.lua|Cannot load: config.lua') { throw 'Teste falhou: servidor ainda nao encontra config.lua.' }
          if ($txt -match 'world.otbm.*No such file|cannot.*world.otbm') { throw 'Teste falhou: mapa ausente/inacessivel.' }
          if ($txt -match 'MYSQL_DB_BACKUP.*invalid|MYSQL_DB_BACKUP.*wrong type') { throw 'Teste falhou: configuracao MYSQL_DB_BACKUP continua invalida.' }
          Write-Host '[OK] O executavel encontrou config.lua e runtime. No runner sem XAMPP, erro de conexao MySQL e esperado.'

      - name: Testar inicializacao basica do cliente
        shell: pwsh
        continue-on-error: true
        run: |
          $wd = (Resolve-Path 'pacote/02 - Cliente Oficial 15.24').Path
          $exe = Join-Path $wd 'bin/client.exe'
          $p = Start-Process -FilePath $exe -WorkingDirectory $wd -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Warning "Cliente encerrou no ambiente sem desktop do GitHub Actions com codigo $($p.ExitCode)."
          } else {
            Write-Host '[OK] Processo do cliente abriu e permaneceu ativo por 8 segundos.'
            Stop-Process -Id $p.Id -Force
          }

      - name: Gerar ZIPs separados
        shell: pwsh
        run: |
          & 7z a -tzip 'Crystal-Server-15.24-PRONTO-XAMPP.zip' '.\pacote\01 - Servidor Crystal 15.24\*' -mx=5 | Out-Host
          & 7z a -tzip 'Cliente-Oficial-15.24-Crystal.zip' '.\pacote\02 - Cliente Oficial 15.24\*' -mx=5 | Out-Host
          if (-not (Test-Path 'Crystal-Server-15.24-PRONTO-XAMPP.zip')) { throw 'ZIP do servidor nao foi criado.' }
          if (-not (Test-Path 'Cliente-Oficial-15.24-Crystal.zip')) { throw 'ZIP do cliente nao foi criado.' }

      - name: Publicar servidor pronto
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Server-15.24-PRONTO-XAMPP
          path: Crystal-Server-15.24-PRONTO-XAMPP.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publicar cliente pronto
        uses: actions/upload-artifact@v4
        with:
          name: Cliente-Oficial-15.24-Crystal
          path: Cliente-Oficial-15.24-Crystal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
