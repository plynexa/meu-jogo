name: Compilar servidor Windows
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows.yml'
      - 'servidor/**'
      - 'ferramentas/aplicar_compatibilidade_boost.sh'
      - 'ferramentas/preparar_banco.py'
      - 'ferramentas/build-revision.txt'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-lua51
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
      - name: Aplicar compatibilidade Boost atual
        run: bash ferramentas/aplicar_compatibilidade_boost.sh
      - name: Configurar
        run: cmake -S servidor -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --parallel 2
      - name: Verificar executavel
        run: ./build/MeuJogoServidor.exe --version
      - name: Empacotar servidor e dependencias
        run: |
          mkdir -p dist/Servidor
          cp build/MeuJogoServidor.exe dist/Servidor/
          cp /ucrt64/bin/*.dll dist/Servidor/
      - name: Criar banco SQLite inicial
        shell: pwsh
        run: python ferramentas/preparar_banco.py dist/Servidor/meujogo.s3db
      - name: Criar aviso do pacote
        shell: pwsh
        run: "Set-Content -Path dist/LEIA.txt -Value 'Servidor Windows compilado com banco SQLite inicial. Os dados, mapa e cliente sao adicionados no pacote de teste completo.'"
      - uses: actions/upload-artifact@v4
        with:
          name: MeuJogo-Servidor-Windows-preparacao
          path: dist/
          if-no-files-found: error
